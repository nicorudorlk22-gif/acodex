<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Acode — Teste Web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1e1e1e;
    --bg2: #252526;
    --bg3: #2d2d30;
    --border: #3c3c3c;
    --text: #cccccc;
    --text2: #8a8a8a;
    --accent: #4fc1ff;
    --green: #89d185;
    --header-h: 42px;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
  }
  header .logo {
    width: 22px; height: 22px;
    background: var(--accent);
    -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>') center/contain no-repeat;
    mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.4 16.6 4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0 4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>') center/contain no-repeat;
  }
  header h1 { font-size: 15px; font-weight: 500; color: #eee; }
  header .spacer { flex: 1; }
  header button {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); color: #fff; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 230px;
    min-width: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .2s ease;
  }
  #sidebar.hidden { margin-left: -230px; }
  #sidebar .section-title {
    padding: 10px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text2);
  }
  #file-tree { flex: 1; overflow-y: auto; padding: 0 6px 12px; }
  .tree-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-item:hover { background: var(--bg3); }
  .tree-item.active { background: #094771; color: #fff; }
  .tree-item .icon { width: 15px; text-align: center; flex-shrink: 0; }
  .tree-item .icon.folder { color: #dcb67a; }
  .tree-item .icon.file { color: var(--accent); }

  /* ---- Editor ---- */
  #editor-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #tabs {
    display: flex;
    overflow-x: auto;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    border-right: 1px solid var(--border);
    color: var(--text2);
    flex-shrink: 0;
  }
  .tab.active { background: var(--bg); color: #fff; border-top: 2px solid var(--accent); }
  .tab .close {
    font-size: 15px;
    opacity: .5;
    padding: 0 2px;
  }
  .tab .close:hover { opacity: 1; color: #f48771; }
  #editor { flex: 1; min-height: 0; }

  /* ---- Console ---- */
  #console {
    height: 150px;
    background: #1b1b1b;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: height .2s ease;
  }
  #console.collapsed { height: 30px; }
  #console .console-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text2);
    cursor: pointer;
    flex-shrink: 0;
  }
  #console-output {
    flex: 1;
    overflow-y: auto;
    font-family: 'Cascadia Code', Consolas, monospace;
    font-size: 12px;
    padding: 0 12px 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #console-output .log { color: #9cdcfe; }
  #console-output .err { color: #f48771; }
  #console-output .ok { color: var(--green); }

  @media (max-width: 700px) {
    #sidebar { position: absolute; z-index: 10; top: var(--header-h); bottom: 0; }
    #sidebar.hidden { margin-left: -230px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <h1>Acode <span style="color:var(--text2);font-size:12px">— teste web</span></h1>
  <div class="spacer"></div>
  <button id="btn-sidebar">Arquivos</button>
  <button id="btn-run">▶ Rodar</button>
</header>

<main>
  <nav id="sidebar">
    <div class="section-title">Explorador</div>
    <div id="file-tree"></div>
  </nav>

  <section id="editor-pane">
    <div id="tabs"></div>
    <div id="editor"></div>
    <div id="console">
      <div class="console-header" id="console-toggle">
        <span>Console</span>
        <span id="console-arrow">▼</span>
      </div>
      <div id="console-output"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.3/src-min-noconflict/ace.js"></script>
<script>
  // ============================================================
  // Acode — página de teste web (autocontida)
  // Reproduz o esqueleto da interface do Acode para testes
  // no navegador, sem precisar compilar o app Android.
  // ============================================================

  var editor = ace.edit("editor");
  editor.setTheme("ace/theme/monokai");
  editor.setOptions({
    fontSize: "14px",
    showPrintMargin: false,
    tabSize: 2,
    enableBasicAutocompletion: true,
    enableLiveAutocompletion: true
  });

  // ---- Arquivos de demonstração (skeleton de projeto) ----
  var FILES = {
    "index.html": { mode: "ace/mode/html", content:
'<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <title>Meu App</title>\n</head>\n<body>\n  <h1>Olá, Acode!</h1>\n  <script src="app.js"><\/script>\n</body>\n</html>' },
    "app.js": { mode: "ace/mode/javascript", content:
'// Teste rápido — clique em "Rodar" para executar no console\nfunction somar(a, b) {\n  return a + b;\n}\n\nconsole.log("Soma:", somar(2, 3));' },
    "style.css": { mode: "ace/mode/css", content:
'body {\n  margin: 0;\n  font-family: sans-serif;\n  background: #1e1e1e;\n  color: #eee;\n}' },
    "package.json": { mode: "ace/mode/json", content:
'{\n  "name": "meu-projeto",\n  "version": "1.0.0",\n  "main": "app.js"\n}' },
    "README.md": { mode: "ace/mode/markdown", content:
'# Meu projeto\n\nEditado no teste web do Acode.\n\n- Editor: Ace (mesmo motor clássico do Acode)\n- Tema: Monokai\n- Teste de console embutido' }
  };

  var openTabs = [];
  var activeFile = null;

  // ---- Árvore de arquivos ----
  var tree = document.getElementById("file-tree");
  Object.keys(FILES).forEach(function (name) {
    var row = document.createElement("div");
    row.className = "tree-item";
    row.innerHTML = '<span class="icon file">&lt;&gt;</span>' + name;
    row.onclick = function () { openFile(name); };
    row.dataset.file = name;
    tree.appendChild(row);
  });

  function syncTree() {
    document.querySelectorAll(".tree-item").forEach(function (el) {
      el.classList.toggle("active", el.dataset.file === activeFile);
    });
  }

  // ---- Abas ----
  function openFile(name) {
    if (openTabs.indexOf(name) === -1) openTabs.push(name);
    activeFile = name;
    var f = FILES[name];
    editor.session.setMode(f.mode);
    editor.setValue(f.content, -1);
    renderTabs();
    syncTree();
  }

  function closeFile(name, ev) {
    if (ev) ev.stopPropagation();
    var i = openTabs.indexOf(name);
    if (i > -1) openTabs.splice(i, 1);
    if (activeFile === name) {
      activeFile = openTabs[openTabs.length - 1] || null;
      if (activeFile) {
        var f = FILES[activeFile];
        editor.session.setMode(f.mode);
        editor.setValue(f.content, -1);
      } else {
        editor.setValue("", -1);
      }
    }
    renderTabs();
    syncTree();
  }

  function renderTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    openTabs.forEach(function (name) {
      var tab = document.createElement("div");
      tab.className = "tab" + (name === activeFile ? " active" : "");
      tab.innerHTML = name + ' <span class="close">×</span>';
      tab.onclick = function () { openFile(name); };
      tab.querySelector(".close").onclick = function (ev) { closeFile(name, ev); };
      tabs.appendChild(tab);
    });
  }

  // ---- Console ----
  function log(msg, cls) {
    var out = document.getElementById("console-output");
    var line = document.createElement("div");
    line.className = cls || "log";
    line.textContent = msg;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  // Rodar: executa o conteúdo do editor JS num escopo controlado
  document.getElementById("btn-run").onclick = function () {
    if (!activeFile) { log("Nenhum arquivo aberto.", "err"); return; }
    log("▶ Executando " + activeFile + "...", "ok");
    var fakeConsole = {
      log: function () {
        log("[log] " + Array.prototype.slice.call(arguments).map(String).join(" "), "log");
      },
      error: function () {
        log("[erro] " + Array.prototype.slice.call(arguments).map(String).join(" "), "err");
      },
      warn: function () {
        log("[aviso] " + Array.prototype.slice.call(arguments).map(String).join(" "), "err");
      }
    };
    if (!/\.js$/.test(activeFile)) {
      log("Apenas arquivos .js podem ser executados aqui.", "err");
      return;
    }
    try {
      new Function("console", editor.getValue())(fakeConsole);
      log("✓ Concluído.", "ok");
    } catch (e) {
      log("✗ " + e.message, "err");
    }
  };

  // ---- UI ----
  document.getElementById("btn-sidebar").onclick = function () {
    document.getElementById("sidebar").classList.toggle("hidden");
    setTimeout(function () { editor.resize(); }, 220);
  };
  document.getElementById("console-toggle").onclick = function () {
    var c = document.getElementById("console");
    c.classList.toggle("collapsed");
    document.getElementById("console-arrow").textContent =
      c.classList.contains("collapsed") ? "▲" : "▼";
    setTimeout(function () { editor.resize(); }, 220);
  };
  window.addEventListener("resize", function () { editor.resize(); });

  // ---- Início ----
  log("Acode — teste web carregado.", "ok");
  log("Abra um arquivo na barra lateral e clique em Rodar.");
  openFile("app.js");
</script>
</body>
</html>
